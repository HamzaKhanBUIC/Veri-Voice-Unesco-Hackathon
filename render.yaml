services:
  - type: web
    name: verivoice
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix frontend install && npm run build:frontend
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPEECH_PROVIDER
        value: whisper
      - key: TTS_PROVIDER
        value: elevenlabs
      - key: LLM_PROVIDER
        value: groq
      - key: DISCORD_MAX_FILE_SIZE_MB
        value: "15"
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_APPLICATION_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY_1
        sync: false
      - key: ELEVENLABS_API_KEY_2
        sync: false
      - key: ELEVENLABS_API_KEY_3
        sync: false
      - key: ELEVENLABS_API_KEY_4
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL

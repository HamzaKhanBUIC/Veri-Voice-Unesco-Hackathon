services:
  - type: web
    name: verivoice
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix frontend install && npm run build:frontend
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPEECH_PROVIDER
        value: whisper
      - key: TTS_PROVIDER
        value: edge-tts
      - key: LLM_PROVIDER
        value: groq
      - key: DISCORD_MAX_FILE_SIZE_MB
        value: "15"
